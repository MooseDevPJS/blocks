[package]
name = "blocks"
version = "0.1.0"
edition = "2024"
description = "Note leggere per Windows: file Markdown, anteprima live, niente telemetria."
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
keywords = ["notes", "markdown", "windows", "egui"]
categories = ["text-editors"]
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "glow"] }
egui_extras = { version = "0.37", features = ["svg", "image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
notify = "8.2.1"
nucleo-matcher = "0.3.1"
raw-window-handle = "0.6"
resvg = "0.45"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
skrifa = "0.44"
sys-locale = "0.3.2"
toml = "1.2.0"
trash = "5"
unicode-normalization = "0.1.26"
window-vibrancy = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
